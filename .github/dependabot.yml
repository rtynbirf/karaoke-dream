version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Рантайм zero-dependency: Dependabot следит за dev-инструментарием,
    # если он появится в будущем.
