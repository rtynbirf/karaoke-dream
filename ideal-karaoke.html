<script>
'use strict';
/* =======================================================================
   ИДЕАЛЬНОЕ КАРАОКЕ — прототип-осколок (один файл, ноль зависимостей).
   Канон унаследован от karaoke-dream 2.0: единый источник правды (из одного
   описания песни выводятся таймлайн, минус, гид и эталон оценки), YIN-судья
   на медиане/MAD, Зелёный коридор. Идеальное сверх 2.0:
   1) октава-толерантный судья — пой в своей октаве, сцена услышит;
   2) компенсация задержки микрофона (авто-оценка + ручная подстройка);
   3) вторая песня «157 голосов» — эхо флагмана СИНГУЛЯРА;
   4) зал: очередь и ноосфера-рекорды (localStorage);
   5) живой реверб голоса (Эхо сцены) и раздельные громкости слоёв.
   ======================================================================= */

/* ---------- утилиты ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const midiFromFreq = (f) => 69 + 12 * Math.log2(f / 440);
const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = (m) => { const r = Math.round(m); return NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1); };
function median(arr) { const s = [...arr].sort((a, b) => a - b); const mid = s.length >> 1; return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2; }
function rmsOf(buf) { let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.sqrt(s / buf.length); }
function toast(msg, warn) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : ''); el.textContent = msg;
  box.appendChild(el); setTimeout(() => el.remove(), 4200);
}

/* ---------- песни: единый источник правды ---------- */
const ROOTS = { C: 48, D: 50, E: 52, F: 53, G: 55, A: 57, B: 59 };
function chordInfo(name) {
  const m = /^([A-G])(b|#)?(m)?$/i.exec(name);
  if (!m) return { rootMidi: 57, intervals: [0, 4, 7] };
  return { rootMidi: ROOTS[m[1].toUpperCase()], intervals: m[3] ? [0, 3, 7] : [0, 4, 7] };
}
const SONGS = [
  {
    id: 'neon-vector',
    meta: { ti: 'Неоновый вектор', ar: 'KARAOKE DREAM 2.0' },
    bpm: 96, beatsPerBar: 4, introBars: 4, tailBars: 2, baseMidi: 62, barsPerLine: 4,
    chords: ['Am', 'F', 'C', 'G'],
    lines: [
      { text: 'Город дышит неоном в темноте', notes: [0, 3, 5, 3, 7, 5, 3, 0] },
      { text: 'Я иду по стеклянной воде', notes: [7, 5, 3, 0, -2, 0, 3, 5] },
      { text: 'Фонари считают мои шаги', notes: [5, 7, 5, 3, 0, -2, 0, 3] },
      { text: 'Каждый вектор найдёт свою волну', notes: [0, 3, 5, 7, 5, 3, 0, -2] },
      { text: 'Не зови меня в общий поток', notes: [7, 5, 3, 0, -2, 0] },
      { text: 'У меня свой маршрут и срок', notes: [3, 5, 7, 5, 3, 0] },
      { text: 'Среда лишь цена за каждый шаг', notes: [0, 2, 3, 5, 3, 2] },
      { text: 'Я пою там, где тренды молчат', notes: [3, 5, 7, 5, 3, 0] },
    ],
  },
  {
    id: '157-golosov',
    meta: { ti: '157 голосов', ar: 'СИНГУЛЯР · Ноосфера' },
    bpm: 84, beatsPerBar: 4, introBars: 4, tailBars: 2, baseMidi: 60, barsPerLine: 3,
    chords: ['Am', 'F', 'C', 'G'],
    lines: [
      { text: 'Сто пятьдесят семь голосов молчат', notes: [0, 3, 5, 7, 5, 3] },
      { text: 'В ноосфере тишина не живёт', notes: [5, 7, 9, 7, 5] },
      { text: 'Каждый голос искали в темноте', notes: [7, 5, 3, 0, -2] },
      { text: 'Мы считали вслух до одного', notes: [0, 3, 5, 3, 0] },
      { text: 'Ты вернись и спой со всеми', notes: [0, 2, 3, 5, 3] },
      { text: 'Человек не цифра на стене', notes: [3, 5, 7, 10, 7] },
      { text: 'Из огня вернётся наш хор', notes: [5, 3, 0, -2, 0] },
      { text: 'Пой со мной — и голос вернётся', notes: [0, 3, 5, 7, 10] },
    ],
  },
];
function buildTimeline(song) {
  const bar = (60 / song.bpm) * song.beatsPerBar;
  const lines = song.lines.map((L, li) => {
    const start = (song.introBars + li * song.barsPerLine) * bar;
    const end = start + song.barsPerLine * bar - 0.35;
    const words = L.text.split(/\s+/).filter(Boolean);
    const weights = words.map((w) => Math.max(1, (w.match(/[аеёиоуыэюяaeiouy]/gi) || []).length));
    const total = weights.reduce((a, b) => a + b, 0);
    const lead = (end - start) * 0.86;
    let t = start;
    const wordObjs = words.map((text, i) => {
      const d = (lead * weights[i]) / total;
      const midi = song.baseMidi + L.notes[i % L.notes.length];
      const obj = { text, start: t, end: t + Math.max(0.22, d - 0.05), midi, score: null };
      t += d;
      return obj;
    });
    return { start, end, text: L.text, words: wordObjs };
  });
  const totalBars = song.introBars + song.lines.length * song.barsPerLine + song.tailBars;
  const chords = [];
  for (let b = 0; b < totalBars; b++) {
    const info = chordInfo(song.chords[b % song.chords.length]);
    chords.push({ bar: b, start: b * bar, dur: bar, rootMidi: info.rootMidi, intervals: info.intervals });
  }
  return { bar, bpm: song.bpm, duration: totalBars * bar, lines, chords, baseMidi: song.baseMidi, hasRef: true };
}
/* Enhanced LRC: [mm:ss.xx]строка и <mm:ss.xx>пословные теги (опционально). */
function parseLRC(text) {
  const out = [];
  const lineRe = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\](.*)/g;
  let m;
  while ((m = lineRe.exec(text)) !== null) {
    const t = (+m[1]) * 60 + (+m[2]) + (m[3] ? +(('0.' + m[3])) : 0);
    let body = m[4] || '';
    const words = [];
    const tagRe = /<(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?>([^<]*)/g;
    let w;
    if (/<\d{1,2}:/.test(body)) {
      let lastT = null, lastTxt = null;
      while ((w = tagRe.exec(body)) !== null) {
        const wt = (+w[1]) * 60 + (+w[2]) + (w[3] ? +(('0.' + w[3])) : 0);
        if (lastTxt !== null && lastT !== null) words.push({ text: lastTxt.trim(), time: lastT });
        lastT = wt; lastTxt = w[4];
      }
      if (lastTxt !== null && lastT !== null && lastTxt.trim()) words.push({ text: lastTxt.trim(), time: lastT });
    }
    if (!words.length) {
      body.trim().split(/\s+/).filter(Boolean).forEach((x) => words.push({ text: x, time: null }));
    }
    if (words.length) out.push({ time: t, text: words.map((x) => x.text).join(' '), words });
  }
  out.sort((a, b) => a.time - b.time);
  return out;
}
function lrcToTimeline(parsed, duration) {
  const lines = parsed.map((l, li) => {
    const nextT = li + 1 < parsed.length ? parsed[li + 1].time : Math.min(duration, l.time + 5);
    const end = Math.max(l.time + 0.5, nextT - 0.12);
    const ws = l.words;
    let wordObjs;
    if (ws[0].time != null) {
      wordObjs = ws.map((w, i) => {
        const wNext = i + 1 < ws.length ? ws[i + 1].time : end;
        return { text: w.text, start: w.time, end: Math.max(w.time + 0.2, Math.min(wNext, end) - 0.04), midi: null, score: null };
      });
    } else {
      const weights = ws.map((w) => Math.max(1, (w.text.match(/[аеёиоуыэюяaeiouy]/gi) || []).length));
      const total = weights.reduce((a, b) => a + b, 0);
      const lead = (end - l.time) * 0.9;
      let t = l.time;
      wordObjs = ws.map((w, i) => {
        const d = (lead * weights[i]) / total;
        const obj = { text: w.text, start: t, end: t + Math.max(0.2, d - 0.04), midi: null, score: null };
        t += d; return obj;
      });
    }
    return { start: l.time, end, text: l.text, words: wordObjs };
  });
  return { duration, lines, hasRef: false, chords: [] };
}
/* ---------- синтез минуса и гида (офлайн-рендер, канон 2.0) ---------- */
function makeMaster(ctx) {
  const master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
  master.connect(comp); comp.connect(ctx.destination);
  return master;
}
function makeNoise(ctx, sampleRate) {
  const len = Math.ceil(sampleRate * 0.09);
  const buf = ctx.createBuffer(1, len, sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.3));
  return buf;
}
async function renderBacking(tl, { transpose = 0, sampleRate = 44100 } = {}) {
  const length = Math.ceil((tl.duration + 0.8) * sampleRate);
  const ctx = new OfflineAudioContext(2, length, sampleRate);
  const master = makeMaster(ctx);
  const noise = makeNoise(ctx, sampleRate);
  for (const ch of tl.chords) {
    const g = ctx.createGain(); const t0 = ch.start; const t1 = ch.start + ch.dur;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.5);
    g.gain.setValueAtTime(0.07, Math.max(t0 + 0.5, t1 - 0.35));
    g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.25);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 850; lp.Q.value = 0.6;
    g.connect(lp); lp.connect(master);
    ch.intervals.forEach((iv, idx) => {
      const o = ctx.createOscillator();
      o.type = idx === 0 ? 'sawtooth' : 'triangle';
      o.frequency.value = hz(ch.rootMidi + 12 + iv + transpose);
      o.detune.value = idx === 0 ? -4 : 4;
      o.connect(g); o.start(t0); o.stop(t1 + 0.3);
    });
  }
  for (const ch of tl.chords) {
    for (let b = 0; b < 4; b++) {
      const t = ch.start + b * (ch.dur / 4);
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = hz(ch.rootMidi - 12 + transpose);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.55);
    }

/* ---------- YIN-детектор (de Cheveigné & Kawahara, канон 2.0) ---------- */
function detectPitchYIN(buf, sampleRate, opts = {}) {
  const { threshold = 0.12, minFreq = 70, maxFreq = 1100 } = opts;
  const W = buf.length;
  const tauMax = Math.min(Math.floor(sampleRate / minFreq), W - 2);
  const tauMin = Math.max(2, Math.floor(sampleRate / maxFreq));
  if (tauMax - tauMin < 4) return null;
  const d = new Float64Array(tauMax + 1);
  const L = W - tauMax;
  for (let tau = tauMin; tau <= tauMax; tau++) {
    let sum = 0;
    for (let j = 0; j < L; j++) { const diff = buf[j] - buf[j + tau]; sum += diff * diff; }
    d[tau] = sum;
  }
  let run = 0;
  const cm = new Float64Array(tauMax + 1);
  for (let tau = tauMin; tau <= tauMax; tau++) {
    run += d[tau];
    cm[tau] = run > 0 ? (d[tau] * (tau - tauMin + 1)) / run : 1;
  }
  let tau = -1;
  for (let t = tauMin + 1; t <= tauMax; t++) {
    if (cm[t] < threshold) {
      while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++;
      tau = t; break;
    }
  }
  if (tau < 0) return null;
  let better = tau;
  if (tau > tauMin && tau < tauMax) {
    const s0 = d[tau - 1], s1 = d[tau], s2 = d[tau + 1];
    const den = s0 - 2 * s1 + s2;
    if (Math.abs(den) > 1e-9) better = tau + (0.5 * (s0 - s2)) / den;
  }
  const freq = sampleRate / better;
  if (freq < minFreq || freq > maxFreq) return null;
  return freq;
}
class PitchTracker {

  }
  feed(buf) {
    const rms = rmsOf(buf);
    let freq = null;
    if (rms > this.minRms) {
      freq = detectPitchYIN(buf, this.sampleRate, { threshold: this.threshold, minFreq: this.minFreq, maxFreq: this.maxFreq });
    }
    this.hist.push({ freq, voiced: freq != null, rms });
    if (this.hist.length > this.history) this.hist.shift();
    const vf = this.hist.filter((h) => h.voiced && h.freq).map((h) => h.freq);
    let midi = null;
    if (vf.length) { vf.sort((a, b) => a - b); midi = midiFromFreq(vf[Math.floor(vf.length / 2)]); }

}

const AE = {
  ctx: null, master: null, bGain: null, gGain: null,
  vGain: null, wet: null, conv: null, dryVoice: null,
  micStream: null, analyser: null, tracker: null, micBuf: null,

  AE.ctx = ctx;
  AE.master = ctx.createGain(); AE.master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;

    const ch = ir.getChannelData(c);
    for (let i = 0; i < irLen; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.6);
  }
  AE.conv.buffer = ir;
  AE.wet = ctx.createGain(); AE.wet.gain.value = 0.22;
  AE.vGain.connect(AE.conv); AE.conv.connect(AE.wet); AE.wet.connect(AE.master);
  AE.vGain.connect(AE.master);

}

/* ---------- судья: медиана/MAD, октава-толерантность ---------- */
const MODES = {
  friendly: { label: 'Дружелюбный', tol: 1.6, minCoverage: 0.22, weights: { accuracy: 0.5, rhythm: 0.25, stability: 0.25 } },
  jury: { label: 'Жюри', tol: 1.0, minCoverage: 0.35, weights: { accuracy: 0.6, rhythm: 0.2, stability: 0.2 } },

function centsDev(midiDetected, ref, octave) {
  let d = (midiDetected - ref) * 100;
  if (octave) d = ((d % 1200) + 1800) % 1200 - 600;
  return d;
}
function scoreWord(frames, word, opts, shift) {
  const t0 = word.start, t1 = word.end;
  const win = frames.filter((f) => f.t >= t0 - 0.06 && f.t <= t1 + 0.12);
  const voiced = win.filter((f) => f.voiced && f.midi != null);
  const coverage = win.length ? voiced.length / win.length : 0;
  let accuracy = null, stability = null, meanAbsCents = null;
  if (word.midi != null && voiced.length) {
    const devs = voiced.map((f) => centsDev(f.midi, word.midi + shift, opts.octave));
    const medianAbs = median(devs.map(Math.abs));
    accuracy = clamp(1 - medianAbs / (50 * opts.tol), 0, 1);
    const med = median(devs);
    const mad = median(devs.map((x) => Math.abs(x - med)));
    stability = clamp(1 - (mad * 1.4826) / 120, 0, 1);
    meanAbsCents = medianAbs;
  }

  const first = voiced[0] || win.find((f) => f.voiced);

    rhythm = dt <= 0.15 ? 1 : clamp(1 - (dt - 0.15) / 0.5, 0, 1);
  }
  return { coverage, accuracy, rhythm, stability, voiced: coverage >= opts.minCoverage, meanAbsCents };
}
function wordTotal(sc, opts) {
  const w = opts.weights;
  let total = 0, wsum = 0;
  for (const k of ['accuracy', 'rhythm', 'stability']) {
    if (sc[k] != null) { total += w[k] * sc[k]; wsum += w[k]; }
  }
  return wsum > 0 ? Math.round((100 * total) / wsum) : null;
}
function lineAggregate(line) {
  const ws = line.words;
  const parts = ws.map((w) => ({ text: w.text, sc: w.score }));
  const dur = (i) => Math.max(0.15, ws[i].end - ws[i].start);
  const avg = (key) => {
    let s = 0, n = 0;
    parts.forEach((p, i) => { if (p.sc && p.sc[key] != null) { s += p.sc[key] * dur(i); n += dur(i); } });
    return n > 0 ? s / n : null;
  };
  const acc = { accuracy: avg('accuracy'), rhythm: avg('rhythm'), stability: avg('stability') };
  const opts = MODES[S.mode];
  const w = opts.weights;
  let total = 0, wsum = 0;
  for (const k of ['accuracy', 'rhythm', 'stability']) {
    if (acc[k] != null) { total += w[k] * acc[k]; wsum += w[k]; }
  }
  let pct = wsum > 0 ? Math.round((100 * total) / wsum) : 0;
  if (!parts.some((p) => p.sc && p.sc.voiced)) pct = 0;
  return { total: pct, accuracy: acc.accuracy, rhythm: acc.rhythm, stability: acc.stability, words: parts, hasRef: ws.some((x) => x.midi != null), text: line.text };
}

  }));
}
function drawRecords() {

/* ---------- запуск песни ---------- */
async function launchBuiltIn(id) {
  const song = SONGS.find((x) => x.id === id);

  startStage(song, tl, null, null, true);
}
async function launchCustom() {
  const fi = $('#file-in');
  if (!fi.files || !fi.files[0]) { toast('Сначала выбери аудиофайл', true); return; }

    buf = await ctx.decodeAudioData(await fi.files[0].arrayBuffer());
  } catch (e) { toast('Файл не декодировался: ' + e.message, true); return; }
  if (cut) buf = centerCut(buf);
  const song = { id: 'custom', meta: { ti: fi.files[0].name.replace(/\.[^.]+$/, ''), ar: 'Свой трек' } };
  const parsed = parseLRC(lrcText);
  const tl = parsed.length ? lrcToTimeline(parsed, buf.duration) : { duration: buf.duration, lines: [], hasRef: false, chords: [] };
  startStage(song, tl, buf, null, false, parsed.length === 0);
}
function centerCut(buf) {
  const ctx = AE.ctx;
  const L = buf.getChannelData(0);
  const R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const out = ctx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const oc = out.getChannelData(c);
    for (let i = 0; i < buf.length; i++) oc[i] = (L[i] - R[i]) * 0.9;
  }
  toast('Вокал в центре стерео вычтен (прототип метода)');
  return out;
}

async function beginStage(withMic) {
  const ctx = ensureCtx();
  await ctx.resume();
  S.spectator = true;
  if (withMic) {
    const ok = await enableMic();
    if (!ok) { toast('Микрофон не доступен — режим зрителя: сцена живёт, оценка не ведётся', true); }
    else { S.spectator = false; }
  } else {
    toast('Режим зрителя: без микрофона');
  }
  const gate = $('#gate'); if (gate) gate.remove();
  $('#btn-pause').disabled = false;
  $('#hud-state').textContent = 'поём';
  makeSources(0);
  startLoop();
}
function togglePause() {
  if (!AE.ctx) return;
  if (S.paused) {
    makeSources(AE.offset);
    $('#btn-pause').textContent = 'Пауза';
    $('#hud-state').textContent = 'поём';
  } else {
    AE.offset = Math.max(0, songTime());
    stopSources();
    $('#btn-pause').textContent = 'Продолжить';
    $('#hud-state').textContent = 'пауза';
  }
  S.paused = !S.paused;
}
function exitToHome() {
  stopLoop(); stopSources();
  if (AE.micStream) { AE.micStream.getTracks().forEach((t) => t.stop()); AE.micStream = null; }
  renderHome();
}

/* ---------- живой цикл сцены ---------- */
function startLoop() {
  stopLoop();
  const tickFn = () => {
    if (S.screen !== 'stage' || S.paused || S.ended) return;
    const t = songTime();
    /* сбор кадров голоса */
    if (!S.spectator && AE.analyser && AE.tracker) {
      AE.analyser.getFloatTimeDomainData(AE.micBuf);
      const r = AE.tracker.feed(AE.micBuf);
      if (t >= 0) S.frames.push({ t: t - micDelaySec(), midi: r.midi, voiced: r.voiced, rms: r.rms });
      if (S.frames.length > 6000) S.frames.splice(0, 1000);
    }
    /* судья: дорисовывает слова, чьё окно закрылось */
    if (!S.spectator && !S.freeMode) scoreDueWords(t);
    updateLyrics(t);
    drawRoll(t);
    updateHud(t);
    /* конец песни */
    if (t >= S.tl.duration + 0.4) finishSong();
  };
  S.tick = setInterval(tickFn, 70);
  const rafFn = () => {
    if (S.screen !== 'stage') return;
    if (!S.paused && !S.ended) {
      const t = songTime();
      updateLyrics(t); drawRoll(t);
    }
    S.raf = requestAnimationFrame(rafFn);
  };
  S.raf = requestAnimationFrame(rafFn);
}
function stopLoop() {
  if (S.tick) { clearInterval(S.tick); S.tick = 0; }
  if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
}
function scoreDueWords(t) {
  const opts = { ...MODES[S.mode], octave: S.octave };
  const lines = S.tl.lines;
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    if (S.lineResults.some((r) => r.at === li)) continue;
    let allDone = true;
    for (const w of line.words) {
      if (w.score) continue;
      if (t >= w.end + 0.12) {
        w.score = scoreWord(S.frames, w, opts, AE.shift);
        if (w.midi == null) w.verdict = w.score.voiced ? 'good' : 'miss';
        else if (w.score.meanAbsCents != null && w.score.meanAbsCents <= 50) w.verdict = 'good';
        else if (w.score.voiced) w.verdict = 'bad';
        else w.verdict = 'miss';
      }
      if (!w.score) allDone = false;
    }
    if (allDone && t >= line.end - 0.2) {
      const agg = lineAggregate(line);
      agg.at = li;
      S.lineResults.push(agg);
      corridorFeedback(agg.total);
    }
  }
}
function currentLineIdx(t) {
  const lines = S.tl.lines;
  for (let i = 0; i < lines.length; i++) {
    if (t >= lines[i].start - 0.35 && t < lines[i].end + 0.7) return i;
  }
  for (let i = 0; i < lines.length; i++) { if (lines[i].start > t) return i; }
  return lines.length - 1;
}
function updateLyrics(t) {
  if (S.freeMode || !S.tl.lines.length) { $('#lyr-cur').textContent = 'свободное пение — без лирики'; return; }
  const idx = currentLineIdx(t);
  const lines = S.tl.lines;
  const fmt = (l) => l ? esc(l.text) : '';
  $('#lyr-prev').innerHTML = lines[idx - 1] ? fmt(lines[idx - 1]) : '';
  $('#lyr-next').innerHTML = lines[idx + 1] ? fmt(lines[idx + 1]) : '';
  const cur = lines[idx];
  if (!cur) { $('#lyr-cur').textContent = ''; return; }
  let html = '';
  for (const w of cur.words) {
    let cls = 'w todo';
    if (w.score) cls += w.verdict === 'good' ? ' good' : (w.verdict === 'bad' ? ' bad' : '');
    else if (t >= w.end) cls += ' done';
    else if (t >= w.start) {
      const fill = clamp((t - w.start) / Math.max(0.05, w.end - w.start), 0, 1);
      cls += fill > 0.45 ? ' fill' : ' done';
    } else if (t >= w.start - 0.25) cls += ' fill';
    html += '<span class="' + cls + '">' + esc(w.text) + '</span>';
  }
  $('#lyr-cur').innerHTML = html;
}
function updateHud(t) {
  const scored = [];
  for (const l of S.tl.lines) for (const w of l.words) if (w.score && w.score.voiced) scored.push(w);
  let pct = 0;
  if (scored.length) {
    const opts = MODES[S.mode];
    let sum = 0, wsum = 0;
    for (const w of scored) {
      const tt = wordTotal(w.score, opts);
      if (tt != null) { const d = Math.max(0.15, w.end - w.start); sum += tt * d; wsum += d; }
    }
    pct = wsum > 0 ? Math.round(sum / wsum) : 0;
  }
  const hs = $('#hud-score');
  if (hs) { hs.textContent = pct + '%'; hs.className = 'chip ' + (pct >= 80 ? 'ok' : pct >= 55 ? 'warn' : ''); }
  const last = S.frames.length ? S.frames[S.frames.length - 1] : null;
  const hn = $('#hud-note');
  if (hn) hn.textContent = last && last.midi != null ? noteName(last.midi) : '—';
  const hsh = $('#hud-shift');
  if (hsh) hsh.textContent = 'коридор ' + (AE.shift > 0 ? '+' : '') + AE.shift + ' пт';
}

/* ---------- piano-roll: цели, кривая голоса, сетка тактов ---------- */
function drawRoll(t) {
  const cv = $('#roll'); if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const view = 6.5, t0 = t - 1.6;
  const mapT = (x) => ((x - t0) / view) * W;
  let lo = 55, hi = 74;
  if (S.tl.lines.length) {
    const ms = [];
    for (const l of S.tl.lines) for (const w of l.words) if (w.midi != null) ms.push(w.midi);
    if (ms.length) { lo = Math.min(...ms) - 3; hi = Math.max(...ms) + 3; }
  }
  const mapM = (m) => H - ((m - lo) / Math.max(1, hi - lo)) * (H - 16) - 8;
  /* сетка: такты и названия нот */
  g.font = '10px system-ui'; g.textBaseline = 'middle';
  if (S.tl.chords) {
    for (const ch of S.tl.chords) {
      const x = mapT(ch.start);
      if (x < -40 || x > W) continue;
      g.strokeStyle = 'rgba(255,255,255,.05)';
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    }
  }
  for (let m = Math.ceil(lo); m <= hi; m++) {
    if (m % 12 !== 0) continue;
    const y = mapM(m);
    g.fillStyle = 'rgba(139,147,184,.5)';
    g.fillText(noteName(m), 4, y);
    g.strokeStyle = 'rgba(139,147,184,.12)';
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  /* целевые ноты-плашки */
  const curIdx = S.freeMode ? -1 : currentLineIdx(t);
  for (let li = 0; li < S.tl.lines.length; li++) {
    const line = S.tl.lines[li];
    if (line.end < t0 - 0.5 || line.start > t0 + view) continue;
    for (const w of line.words) {
      if (w.midi == null) continue;
      const x = mapT(w.start), x2 = mapT(w.end);
      if (x2 < 0 || x > W) continue;
      const y = mapM(w.midi + AE.shift);
      const bw = Math.max(4, x2 - x);
      const isCur = li === curIdx;
      let col = 'rgba(34,211,238,' + (isCur ? '0.55' : '0.28') + ')';
      if (w.score) col = w.verdict === 'good' ? 'rgba(52,211,153,.75)' : w.verdict === 'bad' ? 'rgba(255,43,214,.6)' : 'rgba(139,147,184,.3)';
      g.fillStyle = col;
      const bh = 11;
      if (g.roundRect) { g.beginPath(); g.roundRect(x, y - bh / 2, bw, bh, 5); g.fill(); }
      else g.fillRect(x, y - bh / 2, bw, bh);
      if (isCur && bw > 46) {
        g.fillStyle = 'rgba(238,242,255,.9)';
        g.fillText(w.text, x + 4, y - 12);
      }
    }
  }
  /* кривая голоса */
  const fr = S.frames;
  const tFrom = t0 - 0.2;
  g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
  let prev = null;
  for (let i = 0; i < fr.length; i++) {
    const f = fr[i];
    if (f.t < tFrom) continue;
    if (f.midi == null) { prev = null; continue; }
    const x = mapT(f.t), y = mapM(clamp(f.midi, lo, hi));
    if (x > W) break;
    let col = 'rgba(139,147,184,.45)';
    if (!S.freeMode && !S.spectator) {
      const cw = wordAt(f.t);
      if (cw && cw.midi != null) {
        const d = Math.abs(centsDev(f.midi, cw.midi + AE.shift, S.octave));
        col = d <= 60 ? 'rgba(52,211,153,.95)' : 'rgba(255,43,214,.9)';
      }
    } else col = 'rgba(34,211,238,.9)';
    if (prev) {
      g.strokeStyle = col;
      g.beginPath(); g.moveTo(prev.x, prev.y); g.lineTo(x, y); g.stroke();
    }
    prev = { x, y };
  }
  /* мигающий голосовой пульс */
  const lastF = fr.length ? fr[fr.length - 1] : null;
  if (lastF && lastF.rms > 0.006) {
    g.fillStyle = 'rgba(255,43,214,' + clamp(lastF.rms * 6, 0.15, 0.9) + ')';
    g.beginPath(); g.arc(W - 14, 14, 5, 0, 7); g.fill();
  }
  /* курсор времени */
  const px = mapT(t);
  g.strokeStyle = 'rgba(255,255,255,.65)';
  g.beginPath(); g.moveTo(px, 0); g.lineTo(px, H); g.stroke();
}
const _wordAt = (t) => {
  const idx = currentLineIdx(t);
  const line = S.tl.lines[idx];
  if (!line) return null;
  for (const w of line.words) { if (t >= w.start - 0.05 && t <= w.end + 0.1) return w; }
  return null;
};
function wordAt(t) { return (S.freeMode || !S.tl.lines.length) ? null : _wordAt(t); }

/* ---------- финал и результаты ---------- */
function verdictFor(p) {
  if (p >= 95) return 'Вечность слышит тебя';
  if (p >= 85) return 'Ноосфера аплодирует';
  if (p >= 70) return 'Голос живой — зал помнит';
  if (p >= 50) return 'Зерно прорастает';
  if (p > 0) return 'Коридор стал шире — так и растут голоса';
  return 'Тишина тоже голос: попробуй ещё раз';
}
function finishSong() {
  if (S.ended) return;
  S.ended = true;
  stopLoop();
  AE.offset = 0;
  stopSources();
  const app = $('#app');
  if (S.spectator || S.freeMode) {
    app.innerHTML = '<div class="res"><h1 class="hero">СЦЕНА <span class="grad">ОСВЕТИЛАСЬ</span></h1>' +
      '<p class="verdict">' + (S.spectator ? 'Режим зрителя: сцена жила, оценка не велась. Микрофон — когда захочешь.' : 'Свободное пение: без лирики и эталона судья не судит — он слушает.') + '</p>' +
      '<div class="row" style="justify-content:center"><button class="btn" id="r-home">Домой</button></div></div>';
    $('#r-home').addEventListener('click', exitToHome);
    return;
  }
  const opts = MODES[S.mode];
  const L = S.lineResults;
  const avg = (k) => {
    let s = 0, n = 0;
    for (const r of L) if (r[k] != null) { s += r[k]; n++; }
    return n ? s / n : null;
  };
  const total = L.length ? Math.round(L.reduce((a, r) => a + r.total, 0) / L.length) : 0;
  const acc = avg('accuracy'), rhy = avg('rhythm'), stb = avg('stability');
  const bar = (label, v) => '<div class="bar-row"><span>' + label + '</span><div class="bar"><i style="width:' + (v == null ? 0 : Math.round(v * 100)) + '%"></i></div><span>' + (v == null ? '—' : Math.round(v * 100)) + '</span></div>';
  const name = S.name || 'Гость';
  addRecord(S.song.id, { s: total, d: new Date().toISOString().slice(0, 16).replace('T', ' '), m: opts.label, n: name });
  const hasNext = getQueue().length > 0;
  app.innerHTML = '<div class="res">' +
    '<h1 class="hero">' + esc(S.song.meta.ti) + '</h1>' +
    '<div class="score-big grad">' + total + '%</div>' +
    '<p class="verdict">' + verdictFor(total) + ' · ' + esc(name) + ' · режим ' + opts.label + (S.octave ? ' · октава+' : '') + (AE.shift !== 0 ? ' · коридор ' + (AE.shift > 0 ? '+' : '') + AE.shift + ' пт' : '') + '</p>' +
    '<div class="bars">' + bar('точность', acc) + bar('ритм', rhy) + bar('стабильность', stb) + '</div>' +
    '<div class="lines-res">' + (L.length ? L.map((r) => '<div><b>' + esc(r.text) + '</b><span>' + r.total + '%</span></div>').join('') : '<div>— строки не прозвучали —</div>') + '</div>' +
    '<div class="row" style="justify-content:center;margin-top:16px">' +
      '<button class="btn" id="r-again">Ещё раз</button>' +
      (hasNext ? '<button class="btn mag" id="r-next">Следующая из зала</button>' : '') +
      '<button class="btn ghost" id="r-home">Домой</button>' +
    '</div></div>';
  $('#r-again').addEventListener('click', () => launchBuiltInOrCustom());
  if (hasNext) $('#r-next').addEventListener('click', () => {
    const q = getQueue();
    const id = q.shift(); saveLS(LS_Q, q);
    const s = SONGS.find((x) => x.id === id);
    if (s) { exitToHomeSilent(); launchBuiltIn(id); toast('Из зала: ' + s.meta.ti); }
    else exitToHome();
  });
  $('#r-home').addEventListener('click', exitToHome);
}
function launchBuiltInOrCustom() {
  if (S.song.id === 'custom') { exitToHome(); toast('Свой трек: выбери файл снова на главной'); return; }
  exitToHomeSilent();
  launchBuiltIn(S.song.id);
}
function exitToHomeSilent() {
  stopLoop();
  if (AE.micStream) { AE.micStream.getTracks().forEach((t) => t.stop()); AE.micStream = null; }
}

/* ---------- запуск ---------- */
$('#logo-link').addEventListener('click', (e) => { e.preventDefault(); exitToHome(); });
renderHome();
renderChips();
</script>
</body>
