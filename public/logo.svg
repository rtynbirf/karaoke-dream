<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-label="KARAOKE DREAM 2.0 — Неоновый вектор">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.7" cy="-0.2" r="1.4">
      <stop offset="0" stop-color="#141438"/>
      <stop offset="1" stop-color="#07070f"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1120" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1118" height="298" rx="24" fill="none" stroke="rgba(120,140,255,0.25)"/>

  <!-- волновая форма -->
  <g filter="url(#glow)" opacity="0.9">
    <rect x="60"  y="150" width="10" height="26" rx="5" fill="#22d3ee"/>
    <rect x="82"  y="128" width="10" height="70" rx="5" fill="#22d3ee"/>
    <rect x="104" y="108" width="10" height="110" rx="5" fill="#38bdf8"/>
    <rect x="126" y="140" width="10" height="46" rx="5" fill="#7dd3fc"/>
    <rect x="148" y="92"  width="10" height="142" rx="5" fill="#a78bfa"/>
    <rect x="170" y="126" width="10" height="74" rx="5" fill="#c4b5fd"/>
    <rect x="192" y="70"  width="10" height="186" rx="5" fill="#e879f9"/>
    <rect x="214" y="116" width="10" height="94" rx="5" fill="#f0abfc"/>
  </g>

  <!-- восходящий вектор -->
  <g filter="url(#glow)">
    <line x1="70" y1="240" x2="250" y2="70" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M250 70 L214 78 L240 102 Z" fill="#34d399"/>
  </g>

  <text x="300" y="128" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="6" fill="url(#g1)" filter="url(#glow)">KARAOKE DREAM 2.0</text>
  <text x="304" y="182" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="26" letter-spacing="3" fill="#a8b0d8">Неоновый вектор — среда подстраивается под певца</text>
  <text x="304" y="226" font-family="Consolas, monospace" font-size="20" fill="#5b648f">WebAudio · YIN · Enhanced LRC · zero-dependency</text>
</svg>
